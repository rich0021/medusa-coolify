# Plug-and-play Medusa v2 stack
# Usage:
#   1. Place this file in the repo root (next to the ./medusa folder)
#   2. Replace medusa/Dockerfile with the provided patched Dockerfile
#      (removes the build-time migration so the image builds without a live DB)
#   3. (optional) copy .env.example -> .env and edit secrets/CORS
#   4. docker compose up -d --build
#
# Services: postgres, redis, medusa-server (admin + API), medusa-worker
# Admin UI:  http://localhost:7018/app
# Store API: http://localhost:7018/store

# Shared env for both server and worker (DRY via YAML anchor)
x-medusa-env: &medusa-env
  # sslmode=disable: the local Postgres container has no SSL; Medusa would
  # otherwise try SSL in production mode and fail to connect.
  DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa?sslmode=disable
  REDIS_URL: redis://redis:6379
  COOKIE_SECRET: ${COOKIE_SECRET:-supersecret}
  JWT_SECRET: ${JWT_SECRET:-supersecret2}
  STORE_CORS: ${STORE_CORS:-http://localhost:7018}
  ADMIN_CORS: ${ADMIN_CORS:-http://localhost:7018}
  AUTH_CORS: ${AUTH_CORS:-http://localhost:7018}
  BACKEND_URL: ${BACKEND_URL:-http://localhost:7018}
  PORT: 9000

services:
  postgres:
    image: postgis/postgis:16-master
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  medusa-server:
    build:
      context: ./medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *medusa-env
      WORKER_MODE: server
      DISABLE_ADMIN: "false"
    ports:
      - "7018:9000" # browser -> http://localhost:7018  (container serves on 9000)
    # migrations.sh runs `medusa db:migrate` (server only), then execs the CMD
    entrypoint: ["./migrations.sh"]
    command: ["yarn", "run", "start"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  medusa-worker:
    build:
      context: ./medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # wait until the server has finished migrating + is healthy
      medusa-server:
        condition: service_healthy
    environment:
      <<: *medusa-env
      WORKER_MODE: worker
      DISABLE_ADMIN: "true"
    # WORKER_MODE=worker makes migrations.sh skip migrations and just start
    entrypoint: ["./migrations.sh"]
    command: ["yarn", "run", "start"]

volumes:
  database:
  redis_data:
